    <template id="tmpl-self-agendamento">
        <form class="modal-form">
            <select required>
                <option value="" disabled selected>Selecione o Pet...</option>
                <option>Rex (Cachorro)</option>
                <option>Mial (Gato)</option>
                <option>-- Cadastrar novo pet --</option>
            </select>
            <select required>
                <option value="" disabled selected>Motivo da visita...</option>
                <option>Consulta Geral</option>
                <option>Vacina</option>
                <option>Banho & Tosa</option>
            </select>
            <input type="date" required>
            <input type="time" required>
            
            <div class="modal-footer">
                <button type="button" class="btn-secondary close-panel-action">Cancelar</button>
                <button type="button" class="btn-primary close-panel-action">Confirmar Agendamento</button>
            </div>
        </form>
