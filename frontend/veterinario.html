<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patinhas Felizes - Painel do Veterinário</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="navbar">
    <a href="#" class="navbar-brand">
      <span class="material-symbols-outlined brand-badge">pets</span> Patinhas <span style="color: var(--primary-yellow);">Felizes</span>
    </a>
    <nav class="navbar-roles">
      <a href="atendente.html" class="role-btn">Atendente</a>
      <a href="index.html" class="role-btn">Cliente</a>
      <a href="gestor.html" class="role-btn">Gestor</a>
      <a href="veterinario.html" class="role-btn active">Veterinário</a>
    </nav>
  </header>

  <!-- ABAS VETERINÁRIO -->
  <nav class="subnav-container">
    <button class="subnav-btn active" data-target="secao-fila">
      <span class="material-symbols-outlined">format_list_bulleted</span> Fila de Atendimentos
    </button>
    <button class="subnav-btn" data-target="secao-consulta">
      <span class="material-symbols-outlined">stethoscope</span> Registrar Consulta
    </button>
    <button class="subnav-btn" data-target="secao-vacinacao">
      <span class="material-symbols-outlined">vaccines</span> Registrar Vacinação
    </button>
  </nav>

  <main class="main-container">

    <!-- 1. SEÇÃO FILA DE ATENDIMENTOS -->
    <section id="secao-fila" class="content-section active">
      <div class="card-box">
        <div class="card-header">
          <h2>Pacientes Aguardando / Agendados</h2>
        </div>
        <div class="table-responsive">
          <table id="tabela-fila-vets">
            <thead>
              <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Paciente</th>
                <th>Tutor</th>
                <th>Tipo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="6" style="text-align: center;">Carregando atendimentos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 2. SEÇÃO REGISTRAR CONSULTA & PRONTUÁRIO -->
    <section id="secao-consulta" class="content-section">
      <div class="card-box">
        <div class="card-header">
          <h2>Prontuário & Atendimento Clínico</h2>
        </div>
        <form id="form-registro-consulta">
          <div class="form-grid">
            <div class="form-group">
              <label for="consulta-id-atendimento">ID do Atendimento *</label>
              <input type="number" id="consulta-id-atendimento" placeholder="Ex: 1" required>
            </div>
            <div class="form-group">
              <label for="consulta-peso">Peso Atual (kg)</label>
              <input type="number" step="0.01" id="consulta-peso" placeholder="Ex: 12.50">
            </div>
            <div class="form-group">
              <label for="consulta-temperatura">Temperatura (°C)</label>
              <input type="number" step="0.1" id="consulta-temperatura" placeholder="Ex: 38.5">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 15px;">
            <label for="consulta-diagnostico">Diagnóstico / Anamnese *</label>
            <textarea id="consulta-diagnostico" rows="3" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit;" placeholder="Descreva os achados clínicos e o diagnóstico do paciente..." required></textarea>
          </div>

          <div class="form-group" style="margin-bottom: 15px;">
            <label for="consulta-prescricao">Prescrição de Medicamentos / Recomendações</label>
            <textarea id="consulta-prescricao" rows="2" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit;" placeholder="Ex: Amoxicilina 250mg - 1 comp a cada 12h por 7 dias."></textarea>
          </div>

          <button type="submit" class="btn-primary-yellow">Finalizar e Salvar Consulta</button>
        </form>
      </div>
    </section>

    <!-- 3. SEÇÃO REGISTRAR VACINAÇÃO -->
    <section id="secao-vacinacao" class="content-section">
      <div class="card-box">
        <div class="card-header">
          <h2>Registro de Aplicação de Vacina</h2>
        </div>
        <form id="form-registro-vacina">
          <div class="form-grid">
            <div class="form-group">
              <label for="vacina-id-atendimento">ID do Atendimento *</label>
              <input type="number" id="vacina-id-atendimento" placeholder="Ex: 1" required>
            </div>
            <div class="form-group">
              <label for="vacina-nome">Nome da Vacina *</label>
              <input type="text" id="vacina-nome" placeholder="Ex: V10, Antirrábica, Giárdia..." required>
            </div>
            <div class="form-group">
              <label for="vacina-lote">Número do Lote</label>
              <input type="text" id="vacina-lote" placeholder="Ex: LT-2026-X8">
            </div>
            <div class="form-group">
              <label for="vacina-proxima-dose">Previsão da Próxima Dose</label>
              <input type="date" id="vacina-proxima-dose">
            </div>
          </div>

          <button type="submit" class="btn-primary-yellow">Salvar Registro de Vacina</button>
        </form>
      </div>
    </section>

  </main>

  <script src="scripts/api.js"></script>
  <script src="scripts/veterinario.js"></script>
</body>
</html>
