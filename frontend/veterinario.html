<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patas Felizes - Área do Veterinário</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header id="global-header" class="header-container"></header>
    
    <main class="main-container">
        <section class="options-container">
            <button class="btn-category direct-action" data-title="Atendimento em Andamento" data-template="tmpl-atendimento-atual">
                Atendimento Atual
            </button>
            <button class="btn-category direct-action" data-title="Consultar Prontuários" data-template="tmpl-prontuario">
                Histórico de Pets
            </button>
            <button class="btn-category direct-action" data-title="Minha Agenda" data-template="tmpl-agenda">
                Ver Agenda
            </button>
            <button class="btn-category direct-action" data-title="Disponibilidade de Horários" data-template="tmpl-horarios">
                Gerenciar Horários
            </button>
        </section>

        <section id="dynamic-panel" class="panel-container">
            <div class="panel-header">
                <h2 id="panel-title">Título</h2>
                <button id="close-panel" class="btn-close">&times;</button>
            </div>
            
            <div id="panel-dynamic-body" class="panel-body"></div>
        </section>
    </main>

    <template id="tmpl-atendimento-atual">
        <div class="status-box">
            <strong>Em consulta agora (15:30):</strong> Rex (Tutor: João Silva)
        </div>

        <form class="modal-form">
            <label>Diagnóstico / Motivo Atualizado:</label>
            <input type="text" placeholder="Ex: Suspeita de dermatite alérgica..." required>

            <label>Prescrição de Exames:</label>
            <textarea rows="2" placeholder="Descreva os exames necessários (Sangue, Raio-X...)"></textarea>

            <label>Prescrição de Medicamentos:</label>
            <textarea rows="3" placeholder="Ex: Antibiótico de 8h em 8h, 10 gotas..."></textarea>

            <label>Encaminhamento de Vacinas:</label>
            <select>
                <option value="nenhuma" selected>Nenhuma nova vacina</option>
                <option value="v10">Aplicar V10</option>
                <option value="antirrabica">Aplicar Antirrábica</option>
            </select>
            
            <div class="modal-footer">
                <button type="button" class="btn-primary close-panel-action">Salvar e Encerrar Atendimento</button>
            </div>
        </form>
    </template>

    <template id="tmpl-prontuario">
        <div class="list-container">
            <div class="filter-bar">
                <input type="text" placeholder="Buscar pet por nome, raça ou CPF do tutor...">
                <button type="button" class="btn-primary">Buscar</button>
            </div>
            <ul class="data-list">
                <li class="data-item">
                    <div class="item-info">
                        <strong>Mial</strong>
                        <span>Felina - Siamês | Tutora: Ana Costa</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-secondary btn-sm" onclick="alert('Abrindo Histórico Completo de Mial...')">Abrir Histórico</button>
                    </div>
                </li>
                <li class="data-item">
                    <div class="item-info">
                        <strong>Thor</strong>
                        <span>Canina - Golden Retriever | Tutor: Carlos Dias</span>
                    </div>
                    <div class="item-actions">
                        <button class="btn-secondary btn-sm" onclick="alert('Abrindo Histórico Completo de Thor...')">Abrir Histórico</button>
                    </div>
                </li>
            </ul>
        </div>
    </template>

    <template id="tmpl-agenda">
        <div class="list-container">
            <div class="filter-bar">
                <input type="date" value="2026-06-16" title="Data da Agenda">
            </div>
            <ul class="data-list">
                <li class="data-item highlighted">
                    <div class="item-info">
                        <strong>14:00 - Toby (Canina)</strong>
                        <span>Motivo: Retorno Cirúrgico</span>
                    </div>
                    <span class="badge done">[Concluído]</span>
                </li>
                <li class="data-item highlighted">
                    <div class="item-info">
                        <strong>15:30 - Rex (Canina)</strong>
                        <span>Motivo: Consulta de Rotina</span>
                    </div>
                    <span class="badge now">[Agora]</span>
                </li>
                <li class="data-item">
                    <div class="item-info">
                        <strong>16:45 - Luna (Felina)</strong>
                        <span>Motivo: Vacinação Anual</span>
                    </div>
                    <span class="badge waiting">[Aguardando]</span>
                </li>
            </ul>
        </div>
    </template>

    <template id="tmpl-horarios">
        <form class="modal-form">
            <label>Adicionar novo bloco de disponibilidade:</label>
            <div class="filter-bar">
                <select class="flex-2" required>
                    <option value="" disabled selected>Dia da Semana</option>
                    <option>Segunda-feira</option>
                    <option>Terça-feira</option>
                    <option>Quarta-feira</option>
                    <option>Quinta-feira</option>
                    <option>Sexta-feira</option>
                </select>
                <input type="time" title="Hora de Início" required>
                <input type="time" title="Hora de Fim" required>
                <button type="button" class="btn-primary">Adicionar</button>
            </div>
        </form>

        <h4 class="section-title">Meus Horários Atuais:</h4>
        <ul class="data-list">
            <li class="data-item">
                <div class="item-info">
                    <strong>Segundas, Quartas e Sextas</strong>
                    <span>Das 08:00 às 12:00</span>
                </div>
                <div class="item-actions">
                    <button class="action-btn delete-btn" title="Remover Horário">🗑️</button>
                </div>
            </li>
            <li class="data-item">
                <div class="item-info">
                    <strong>Terças e Quintas</strong>
                    <span>Das 14:00 às 18:00</span>
                </div>
                <div class="item-actions">
                    <button class="action-btn delete-btn" title="Remover Horário">🗑️</button>
                </div>
            </li>
        </ul>
    </template>

    <script src="scripts/navbar-loader.js"></script>
    <script src="scripts/veterinario.js"></script>
</body>
</html>
